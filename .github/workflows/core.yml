# Builds the portable C core and runs its tests.
name: core

# Only when something that is built or tested changes: documentation alone
# does not rebuild the firmware (docs.yml checks it).
on:
  push:
    branches: [main]
    paths:
      - "core/**"
      - "app/**"
      - "ports/**"
      - "tests/**"
      - "third_party/**"
      - "tools/**"
      - "vectors/**"
      - "hardware/**"
      - "CMakeLists.txt"
      - ".gitmodules"
      - ".github/workflows/core.yml"
      - "!**/*.md"
  pull_request:
    paths:
      - "core/**"
      - "app/**"
      - "ports/**"
      - "tests/**"
      - "third_party/**"
      - "tools/**"
      - "vectors/**"
      - "hardware/**"
      - "CMakeLists.txt"
      - ".gitmodules"
      - ".github/workflows/core.yml"
      - "!**/*.md"

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      # No apt: the runner's mirror can hang "apt-get update" for the whole
      # job, and make (already there) builds the host tests as well.
      - run: cmake -S . -B build
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure
      - run: python3 -m unittest discover -s tests -v

  pico:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0 # git describe needs the tags: the version is in the firmware
      # tools/build-pico.sh fetches the Pico SDK and Arm's toolchain (checked
      # by its SHA-256) into ~/.cache/dtmf-signer, kept between runs.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/dtmf-signer
          key: pico-sdk-2.3.1-arm-gnu-14.3.rel1-x86_64
      # The SDK builds picotool, which wants libusb; nothing recommended.
      # A hung mirror is cut after 2 minutes and tried again.
      - name: Packages
        timeout-minutes: 8
        run: |
          for i in 1 2 3; do
            timeout 120 sudo apt-get update &&
              timeout 120 sudo apt-get install -y --no-install-recommends ninja-build libusb-1.0-0-dev pkg-config &&
              exit 0
            sleep 10
          done
          exit 1
      # The same build as anyone's: compare the SHA-256 it prints.
      - run: tools/build-pico.sh
      - run: ~/.cache/dtmf-signer/arm-gnu-toolchain-14.3.rel1-x86_64/bin/arm-none-eabi-size build-pico-release/dtmf-signer-pico.elf
      - uses: actions/upload-artifact@v7
        with:
          name: dtmf-signer-pico-uf2
          path: build-pico-release/dtmf-signer-pico.uf2
          if-no-files-found: error
