# Checks the documents: links and anchors resolve, and English and Spanish match.
name: docs

# Only when a document, the checker or this workflow changes.
on:
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - "LICENSE*"
      - "tools/check_docs.py"
      - "tests/test_check_docs.py"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "**/*.md"
      - "LICENSE*"
      - "tools/check_docs.py"
      - "tests/test_check_docs.py"
      - ".github/workflows/docs.yml"

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Tests of the checker
        run: python3 -m unittest discover -s tests -p 'test_check_docs.py' -v
      - name: Links, anchors and English/Spanish parity
        run: python3 tools/check_docs.py
