# The website: the firmware built as WebAssembly for the simulator, the
# site's tests (the simulator's too: here they never skip), the
# translations against English, the parts list against the layout, then
# the build (the SHA-256 of every file printed) and,
# on main, publication on GitHub Pages. Runs only when what the site is made
# from changes.
name: site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "hardware/**"
      - "docs/images/**"
      - "README*.md"
      - "core/**"
      - "app/**"
      - "ports/wasm/**"
      - "third_party/**"
      - "vectors/**"
      - "CMakeLists.txt"
      - "tools/build-wasm.sh"
      - "tools/check_diy.py"
      - "tests/test_bom.py"
      - "tests/test_check_diy.py"
      - "tests/test_site_donate.py"
      - ".github/workflows/site.yml"
  pull_request:
    paths:
      - "site/**"
      - "hardware/**"
      - "docs/images/**"
      - "README*.md"
      - "core/**"
      - "app/**"
      - "ports/wasm/**"
      - "third_party/**"
      - "vectors/**"
      - "CMakeLists.txt"
      - "tools/build-wasm.sh"
      - "tools/check_diy.py"
      - "tests/test_bom.py"
      - "tests/test_check_diy.py"
      - "tests/test_site_donate.py"
      - ".github/workflows/site.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0 # git describe needs the tags: the version is in the firmware
      # The firmware as WebAssembly, for the simulator (Emscripten in Docker,
      # pinned by digest); the SHA-256 of the module is printed.
      - name: Firmware as WebAssembly
        run: tools/build-wasm.sh
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Tests of the site and the simulator
        run: SIM_REQUIRED=1 node --test site/test/*.test.mjs
      - name: Translations against English
        run: node site/check-i18n.mjs
      - name: Parts list against the layout, donation addresses against the READMEs
        run: |
          python3 -m unittest discover -s tests -p 'test_bom.py' -v
          python3 -m unittest discover -s tests -p 'test_site_donate.py' -v
      - name: Build
        run: SITE_COMMIT="${GITHUB_SHA::7}" node site/build.mjs
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/site

  pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    # One deployment at a time, a newer one waiting; pull requests never
    # take part, so they cannot cancel a deployment waiting here.
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
